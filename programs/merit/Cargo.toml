[package]
name = "merit"
version = "0.1.0"
edition = "2021"
description = "Merit campaign escrow, round ledgers, reactive settlement and REX X-post verification"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["implementation"]
implementation = []
custom-heap = []
custom-panic = []

[dependencies]
rialo-venus = "=0.18.1"
rialo-venus-proc-macro = "=0.18.1"
merit-core = { path = "../../crates/merit-core" }

[package.metadata.rex.dependencies]
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
